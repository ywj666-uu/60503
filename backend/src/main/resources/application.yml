server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/opera_teaching?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8mb4
    username: root
    password: root123
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

app:
  jwt:
    secret: opera-teaching-platform-jwt-secret-key-must-be-at-least-256-bits-long
    expiration-ms: 86400000
    refresh-expiration-ms: 604800000
  oss:
    endpoint: oss-cn-hangzhou.aliyuncs.com
    access-key-id: your-access-key-id
    access-key-secret: your-access-key-secret
    bucket-name: opera-teaching
    url-expiration-minutes: 60
  pitch-service:
    base-url: http://localhost:8000
